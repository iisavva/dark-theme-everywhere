<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Тест: тёмный сайт с фиксированным фоном</title>
  <script>
    if (/[?&]stub\b/.test(location.search)) {
      var v = '?v=' + Date.now(); // no stale scripts from the cache
      document.write('<script src="chrome-stub.js' + v + '"><\/script><script src="../src/shared.js' + v + '"><\/script><script src="../src/content.js' + v + '"><\/script>');
    }
  </script>
  <style>
    body { margin: 0; font: 15px Arial, sans-serif; color: #ddd; }
    /* the dark background is a fixed layer behind the content, html/body are transparent */
    .bg { position: fixed; inset: 0; background: #101216; z-index: -1; }
    main { position: relative; padding: 24px; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <main><h1>Тёмный сайт</h1><p>Фон — фиксированный слой. Расширение должно понять, что сайт уже тёмный.</p></main>
</body>
</html>
