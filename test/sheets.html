<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Test: spreadsheet grid (Google Sheets structure)</title>
  <script>
    if (/[?&]stub\b/.test(location.search)) {
      var v = '?v=' + Date.now(); // no stale scripts from the cache
      document.write('<script src="chrome-stub.js' + v + '"><\/script><script src="../src/shared.js' + v + '"><\/script><script src="../src/content.js' + v + '"><\/script>');
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; font: 13px Arial, sans-serif; background: #f9fbfd; }
    #toolbar { height: 48px; background: #f9fbfd; display: flex; align-items: center; padding: 0 12px; }
    #waffle-grid-container { position: absolute; top: 48px; left: 0; right: 0; bottom: 0; }
    #waffle-grid-container canvas { width: 100%; height: 100%; display: block; }
    .waffle-embedded-object-overlay { position: absolute; left: 420px; top: 120px; }
  </style>
</head>
<body>
  <div id="toolbar">File Edit View — the cell grid below is one canvas, like in Google Sheets</div>
  <div id="docs-editor"><div id="waffle-grid-container"><div id="0-grid-container" class="grid-container">
    <div id="0-grid-table-container"><canvas id="grid"></canvas></div>
    <div class="waffle-embedded-object-overlay"><canvas id="chart" width="240" height="160"></canvas></div>
  </div></div></div>
  <script>
    const c = document.getElementById('grid');
    c.width = innerWidth; c.height = innerHeight - 48;
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.strokeStyle = '#e2e2e2';
    for (let x = 0; x < c.width; x += 100) { g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, c.height); g.stroke(); }
    for (let y = 0; y < c.height; y += 21) { g.beginPath(); g.moveTo(0, y + .5); g.lineTo(c.width, y + .5); g.stroke(); }
    g.fillStyle = '#000'; g.font = '13px Arial';
    for (let r = 1; r < 12; r++) g.fillText('Row ' + r, 6, r * 21 + 15);
    const ch = document.getElementById('chart').getContext('2d');
    ['#4285f4', '#ea4335', '#fbbc04', '#34a853'].forEach((col, i) => { ch.fillStyle = col; ch.fillRect(20 + i * 50, 140 - (i + 1) * 30, 36, (i + 1) * 30); });
  </script>
</body>
</html>
