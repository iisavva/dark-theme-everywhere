<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Тест: образцы цветов</title>
  <script>
    if (/[?&]stub\b/.test(location.search)) {
      var v = '?v=' + Date.now(); // no stale scripts from the cache
      document.write('<script src="chrome-stub.js' + v + '"><\/script><script src="../src/shared.js' + v + '"><\/script><script src="../src/content.js' + v + '"><\/script>');
    }
  </script>
  <style>
    body { font: 15px Arial, sans-serif; color: #222; margin: 24px; }
    .row { display: flex; gap: 10px; align-items: center; margin: 8px 0 24px; }
    .shop label { width: 32px; height: 32px; border-radius: 6px; cursor: pointer; border: 1px solid #ccc; display: block; }
    .shop input { display: none; }
    .legend span.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .icons button { width: 36px; height: 36px; border: 0; border-radius: 8px; background: #eee; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Выбор цвета товара — должны остаться настоящие цвета</h2>
  <div class="row shop" id="shop">
    <label style="background:#111"><input type="radio" name="c"></label>
    <label style="background:#f5f5f5"><input type="radio" name="c"></label>
    <label style="background:#1e3a8a"><input type="radio" name="c"></label>
    <label style="background:#b91c1c"><input type="radio" name="c"></label>
    <label style="background:#d4a373"><input type="radio" name="c"></label>
  </div>

  <h2>Легенда графика (не кликается) — инвертируется вместе со страницей</h2>
  <div class="row legend" id="legend">
    <span><span class="dot" style="background:#111"></span>Один</span>
    <span><span class="dot" style="background:#e11d48"></span>Два</span>
    <span><span class="dot" style="background:#2563eb"></span>Три</span>
    <span><span class="dot" style="background:#16a34a"></span>Четыре</span>
  </div>

  <h2>Кнопки панели одного цвета — не палитра</h2>
  <div class="row icons" id="icons">
    <button></button><button></button><button></button><button></button><button></button>
  </div>

  <h2>Стандартный выбор цвета</h2>
  <input type="color" value="#111111">
</body>
</html>
