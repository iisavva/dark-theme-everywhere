<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Тест: встроенные SVG</title>
  <script>
    if (/[?&]stub\b/.test(location.search)) {
      var v = '?v=' + Date.now(); // no stale scripts from the cache
      document.write('<script src="chrome-stub.js' + v + '"><\/script><script src="../src/shared.js' + v + '"><\/script><script src="../src/content.js' + v + '"><\/script>');
    }
  </script>
  <style>
    body { font: 15px Arial, sans-serif; color: #222; margin: 24px; background: #fff; }
    .grid { display: grid; grid-template-columns: repeat(3, 200px); gap: 24px; }
    figure { margin: 0; } figcaption { font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <h1>Достижения</h1>
  <div class="grid">
    <figure><svg id="art" width="150" height="150" viewBox="0 0 150 150"></svg>
      <figcaption>Цветная иллюстрация → как в оригинале</figcaption></figure>
    <figure><svg id="lottie" width="150" height="150" viewBox="0 0 150 150"></svg>
      <figcaption>Анимация, дорисовывается позже → как в оригинале</figcaption></figure>
    <figure><svg id="icon" width="48" height="48" viewBox="0 0 48 48" fill="currentColor"></svg>
      <figcaption>Одноцветная иконка → в теме</figcaption></figure>
    <figure><svg id="chart" width="180" height="120" viewBox="0 0 180 120"></svg>
      <figcaption>График с подписями → в теме</figcaption></figure>
    <figure><svg id="logo" width="120" height="60" viewBox="0 0 120 60"></svg>
      <figcaption>Тёмный логотип из многих фигур → светлый</figcaption></figure>
    <figure><svg id="hidden" width="150" height="150" viewBox="0 0 150 150"></svg>
      <figcaption>Цветные фигуры + много белых на белом (скрытое) → в теме, скрытое не проявляется</figcaption></figure>
  </div>
  <script>
    const NS = 'http://www.w3.org/2000/svg';
    const add = (svg, tag, attrs) => {
      const e = document.createElementNS(NS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      svg.appendChild(e);
      return e;
    };
    // a pinecone mascot with a cake and confetti
    function drawMascot(svg) {
      const scales = ['#e8c9a0', '#dcb48a', '#cfa274', '#f0d7b5', '#c48f5c'];
      for (let i = 0; i < 24; i++) {
        add(svg, 'circle', { cx: 50 + (i % 6) * 10, cy: 40 + Math.floor(i / 6) * 14, r: 9, fill: scales[i % 5], stroke: '#6b4a2b', 'stroke-width': 1 });
      }
      add(svg, 'ellipse', { cx: 75, cy: 120, rx: 30, ry: 8, fill: '#8fd3ff' });
      add(svg, 'rect', { x: 55, y: 100, width: 40, height: 18, fill: '#5aa9e6' });
      const conf = ['#ff4d6d', '#ffd166', '#06d6a0', '#118ab2', '#9b5de5', '#f15bb5'];
      for (let i = 0; i < 18; i++) {
        add(svg, 'rect', { x: 8 + (i * 37) % 134, y: 6 + (i * 23) % 40, width: 6, height: 10, fill: conf[i % 6], transform: `rotate(${i * 20} ${11 + (i * 37) % 134} ${11 + (i * 23) % 40})` });
      }
    }
    drawMascot(document.getElementById('art'));
    setTimeout(() => drawMascot(document.getElementById('lottie')), 700);

    const icon = document.getElementById('icon');
    for (let i = 0; i < 10; i++) add(icon, 'rect', { x: 4 + (i % 5) * 8, y: 8 + Math.floor(i / 5) * 18, width: 6, height: 14 });

    const chart = document.getElementById('chart');
    const bars = ['#4e79a7', '#f28e2b', '#e15759', '#76b7b2', '#59a14f', '#edc948', '#b07aa1', '#ff9da7', '#9c755f'];
    bars.forEach((c, i) => {
      add(chart, 'rect', { x: 10 + i * 18, y: 100 - (20 + i * 8), width: 12, height: 20 + i * 8, fill: c });
    });
    ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'].forEach((t, i) => {
      add(chart, 'text', { x: 10 + i * 28, y: 116, 'font-size': 10, fill: '#333' }).textContent = t;
    });

    // colourful shapes plus many white shapes invisible on the white page (hidden content)
    const hidden = document.getElementById('hidden');
    drawMascot(hidden);
    for (let i = 0; i < 40; i++) add(hidden, 'rect', { x: 5 + (i % 10) * 14, y: 100 + Math.floor(i / 10) * 10, width: 10, height: 6, fill: '#fefefe' });
    const logo = document.getElementById('logo');
    for (let i = 0; i < 12; i++) add(logo, 'circle', { cx: 10 + i * 9, cy: 30, r: 4 + (i % 3), fill: '#111' });
  </script>
</body>
</html>
